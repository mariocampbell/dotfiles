# /etc/X11/xorg.conf
Section "Monitor"
    Identifier "HDMI-0"
    Option "Primary" "true"
    Option "PreferredMode" "1920x1080"
EndSection

Section "Monitor"
    Identifier "DVI-D-0"
    Option "LeftOf" "Primary"
    Option "PreferredMode" "1920x1080"
EndSection

